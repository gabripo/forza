name: Checks

on:
  pull_request:
  push:
    branches: [main]
    paths: ['app/**', 'coach/**', 'shared/**', 'supabase/**']

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_KEY: ci-placeholder
      # Forza! Coach reads the built-in lessons, tips and foods from shared/: they must match the app's.
      - name: shared/knowledge.json and shared/foods.json are up to date
        run: npm run export-knowledge && git diff --exit-code -- ../shared/knowledge.json ../shared/foods.json

  coach:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coach
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: coach/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Syntax
        run: for f in server.mjs cli.mjs lib/*.mjs public/coach.js ../shared/*.mjs; do node --check "$f" || exit 1; done

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts
