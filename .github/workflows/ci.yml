name: Checks

on:
  pull_request:
  push:
    branches: [main]
    paths: ['app/**', 'admin/**', 'supabase/**']

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_KEY: ci-placeholder
      - name: Admin dashboard syntax
        working-directory: admin
        run: node --check server.mjs && node --check public/admin.js
